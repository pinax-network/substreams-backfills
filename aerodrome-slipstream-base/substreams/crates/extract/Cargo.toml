[package]
name = "aerodrome-extractor-extract"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
aerodrome-extractor-core = { path = "../core" }
aerodrome-extractor-pb = { path = "../pb" }
prost = "=0.13.5"
substreams = "=0.7.6"
substreams-ethereum = "=0.11.1"
ethabi = "=17.2.0"
num-bigint = "=0.4.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.16", features = ["custom"] }

[build-dependencies]
anyhow = "=1.0.98"
serde_json = "=1.0.142"
substreams-ethereum = "=0.11.1"
sha2 = "=0.10.9"

[dev-dependencies]
serde_json = "=1.0.142"
hex = "=0.4.3"
prost-types = "=0.13.5"
