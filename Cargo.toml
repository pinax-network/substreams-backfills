[workspace]
resolver = "2"
members = [
    "common",
    "crates/uniswap-v3-overlay-pb",
    "crates/uniswap-v3-reducers",
    "crates/uniswap-v3-runtime",
    "xtask",
]
exclude = ["mapping-host", "uniswap-v3/contract-tests", "uniswap-v3/source", "uniswap-v4"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pinax-network/substreams-backfills"

[workspace.dependencies]
substreams = "0.6"
substreams-ethereum = "0.10"
substreams-entity-change = "2"
prost = "0.13"
prost-types = "0.13"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.10"
serde_json = "1"
chrono = "=0.4.44"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde_yaml = "0.9"
flate2 = "1"
tar = "0.4"
sha1 = "0.10"
# Renamed so the Uniswap V3 overlay sources keep the crate name they resolve
# to inside a materialized runtime tree.
substreams_uniswap_v3 = { package = "uniswap-v3-overlay-pb", path = "crates/uniswap-v3-overlay-pb" }
