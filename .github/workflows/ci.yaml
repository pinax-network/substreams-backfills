name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check workspace formatting
        run: cargo fmt --all --check
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Run strict workspace lints
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: targets are well-formed
        run: |
          python3 -c "
          import yaml, glob, sys
          for f in glob.glob('*/Qm*.yaml'):
              d = yaml.safe_load(open(f))
              assert d['deployment'] in f, f
              assert 'family' in d and 'chain' in d, f
          print('targets ok')
          "

  uniswap-v4-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify history-preserving import
        run: ./scripts/verify-uniswap-v4-import.sh
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown
      - name: Install checksum-pinned Substreams CLI
        run: |
          curl -fsSL https://github.com/streamingfast/substreams/releases/download/v1.20.3/substreams_linux_x86_64.tar.gz -o /tmp/substreams.tar.gz
          echo "90c71d04a75490efdf0493254a8563c3555690e622b3c6ade5100c0c773f8675  /tmp/substreams.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/substreams.tar.gz -C /usr/local/bin substreams
      - name: Run offline parity fixtures
        working-directory: uniswap-v4
        run: ./scripts/offline-parity-ci.sh "$RUNNER_TEMP/uniswap-v4-parity"
      - name: Validate imported source and cache boundaries
        working-directory: uniswap-v4
        run: make validate
      - name: Verify frozen production packages
        working-directory: uniswap-v4
        run: make release-packages RELEASE_DIST="$RUNNER_TEMP/uniswap-v4-release"
      - name: Build evidence-only NUL audit candidate
        working-directory: uniswap-v4
        run: make release-nul-audit-package RELEASE_DIST="$RUNNER_TEMP/uniswap-v4-nul-audit"
      - name: Upload V4 parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniswap-v4-offline-parity
          path: ${{ runner.temp }}/uniswap-v4-parity
          if-no-files-found: error
      - name: Upload frozen package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniswap-v4-frozen-packages
          path: ${{ runner.temp }}/uniswap-v4-release
          if-no-files-found: error
      - name: Upload NUL audit candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniswap-v4-nul-audit-candidate
          path: ${{ runner.temp }}/uniswap-v4-nul-audit
          if-no-files-found: error
