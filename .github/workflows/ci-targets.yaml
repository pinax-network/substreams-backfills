name: ci-targets
# Pinned-baseline families: immutable target verifiers plus exact deployed-source
# reproductions for Matic, Uniswap V2 Base, PancakeSwap Infinity, and Exchange V3.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  changes:
    # Path gate: on pull requests only the listed paths trigger the heavy jobs;
    # every push to main runs everything. The job itself always reports, so a
    # required status check never sits pending on an unrelated PR.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            run:
              - '.github/workflows/ci-targets.yaml'
              - 'scripts/**'
              - 'aerodrome-slipstream-base/**'
              - 'exchange-v3-bsc/**'
              - 'messari-v3/**'
              - 'morpho-blue-base/**'
              - 'pancakeswap-infinity-cl-bsc/**'
              - 'uniswap-v2-base/**'
              - 'uniswap-v3-matic/**'
              - 'docs/provenance/**'
              - 'eligibility/**'
              - 'schemas/**'
  target-baselines:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
      - name: Restore checksum-keyed evidence asset cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/substreams-backfills/evidence-assets
          key: evidence-assets-${{ hashFiles('evidence-assets.lock.json') }}
      - name: Fetch and verify externalized evidence assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask evidence fetch
      - name: Restore checksum-pinned WABT archive
        uses: actions/cache@v4
        with:
          path: ~/.cache/toolchains/wabt-1.0.35-ubuntu-20.04.tar.gz
          key: wabt-1.0.35-cb3d22440273b1e8ee641e622b7a32222d97b519ad46169b1f8fcc6ce9af0b9b
      - name: Install checksum-pinned WABT writer-evidence tool
        run: |
          mkdir -p ~/.cache/toolchains
          archive=~/.cache/toolchains/wabt-1.0.35-ubuntu-20.04.tar.gz
          if [ ! -f "$archive" ]; then
            curl -fsSL \
              https://github.com/WebAssembly/wabt/releases/download/1.0.35/wabt-1.0.35-ubuntu-20.04.tar.gz \
              -o "$archive"
          fi
          echo "cb3d22440273b1e8ee641e622b7a32222d97b519ad46169b1f8fcc6ce9af0b9b  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/wabt-1.0.35/bin/wasm2wat" --version)" = "1.0.35"
          echo "WASM2WAT=$RUNNER_TEMP/wabt-1.0.35/bin/wasm2wat" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/wabt-1.0.35/bin" >> "$GITHUB_PATH"
      - name: Verify immutable Uniswap V3 Matic target and static layout profile
        run: cargo xtask verify-target uniswap-v3-matic
      - name: Verify immutable Uniswap V2 Base target and static source-gap profile
        run: cargo xtask verify-target uniswap-v2-base
      - name: Verify immutable PancakeSwap Infinity CL BSC target
        run: cargo xtask verify-target pancakeswap-infinity-cl-bsc
      - name: Verify immutable Exchange V3 BSC target
        run: cargo xtask verify-target exchange-v3-bsc
      - name: Verify immutable Aerodrome Slipstream CL Base target
        run: |
          wasm-validate aerodrome-slipstream-base/reference/mappings/Factory.wasm
          wasm-validate aerodrome-slipstream-base/reference/mappings/NonfungiblePositionManager.wasm
          wasm-validate aerodrome-slipstream-base/reference/mappings/Pool.wasm
          cargo xtask verify-target aerodrome-slipstream-base
      - name: Verify immutable Messari V3 BSC/Base target baselines
        run: |
          mapfile -t messari_wasm < <(find messari-v3/reference -type f -name '*.wasm' -print | sort)
          test "${#messari_wasm[@]}" -eq 8
          for wasm in "${messari_wasm[@]}"; do
            wasm-validate "$wasm"
          done
          cargo xtask verify-target messari-v3
  uniswap-v3-matic-reference:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
      - name: Restore checksum-keyed evidence asset cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/substreams-backfills/evidence-assets
          key: evidence-assets-${{ hashFiles('evidence-assets.lock.json') }}
      - name: Fetch and verify externalized evidence assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask evidence fetch
      - uses: actions/setup-node@v4
        with:
          node-version: "18.18.0"
      - name: Reproduce exact deployed Matic source and behavior closure
        run: ./scripts/verify-uniswap-v3-matic-source.sh

  uniswap-v2-base-reference:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
      - name: Verify pinned behavioral source and generic extractor gap
        run: ./scripts/verify-uniswap-v2-base-source.sh

  pancakeswap-infinity-cl-bsc-reference:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.1"
      - name: Pin exact npm reproduction tool
        run: |
          npm install --global npm@11.11.0
          test "$(npm --version)" = "11.11.0"
      - name: Reproduce exact deployed Pancake source
        run: ./scripts/verify-pancakeswap-infinity-cl-bsc-source.sh

  exchange-v3-bsc-reference:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
      - uses: actions/setup-node@v4
        with:
          node-version: "14.21.3"
      - name: Pin exact Yarn reproduction tool
        run: |
          npm install --global yarn@1.22.22
          test "$(yarn --version)" = "1.22.22"
      - name: Reproduce exact deployed Exchange V3 BSC source
        run: ./scripts/verify-exchange-v3-bsc-source.sh

