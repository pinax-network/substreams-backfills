          UNISWAP_V3_PARITY_REAL_PACKAGES: ${{ runner.temp }}/uniswap-v3-diagnostic.spkg:${{ runner.temp }}/uniswap-v3-mainnet-configured-diagnostic.spkg:${{ runner.temp }}/uniswap-v3-base-configured-diagnostic.spkg
        run: GOTOOLCHAIN=local go test -mod=readonly ./...
      - name: Record a controlled-build candidate without promoting it
        run: |
          python3 scripts/build-uniswap-v3-mainnet-parity-candidate.py \
            --source-revision "$SOURCE_REVISION" \
            --profile uniswap-v3/fixtures/mainnet-chain-config-parity-v1.json \
            --baseline-spkg "$RUNNER_TEMP/uniswap-v3-diagnostic.spkg" \
            --mainnet-spkg "$RUNNER_TEMP/uniswap-v3-mainnet-configured-diagnostic.spkg" \
            --base-spkg "$RUNNER_TEMP/uniswap-v3-base-configured-diagnostic.spkg" \
            --capture-client "$RUNNER_TEMP/uniswap-v3-parity-client" \
            --output "$RUNNER_TEMP/uniswap-v3-controlled-build-candidate.json"
      - name: Upload V3 diagnostic package
        uses: actions/upload-artifact@v4
        with:
          name: uniswap-v3-diagnostic-package
          path: ${{ runner.temp }}/uniswap-v3-diagnostic.spkg
          if-no-files-found: error
      - name: Upload configured V3 diagnostic packages and hash evidence
        uses: actions/upload-artifact@v4
        with:
          name: uniswap-v3-configured-diagnostic-packages
          path: |
            ${{ runner.temp }}/uniswap-v3-mainnet-configured-diagnostic.spkg
            ${{ runner.temp }}/uniswap-v3-base-configured-diagnostic.spkg
            ${{ runner.temp }}/uniswap-v3-configured-diagnostic-evidence.json
          if-no-files-found: error
      - name: Upload isolated V3 writer diagnostic packages
        uses: actions/upload-artifact@v4
        with:
          name: uniswap-v3-writer-diagnostic-packages
          path: |
            ${{ runner.temp }}/uniswap-v3-mainnet-writer-diagnostic.spkg
            ${{ runner.temp }}/uniswap-v3-base-writer-diagnostic.spkg
          if-no-files-found: error
      - name: Upload the V3 controlled-build candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: uniswap-v3-controlled-build-candidate
          path: |
            ${{ runner.temp }}/uniswap-v3-diagnostic.spkg
            ${{ runner.temp }}/uniswap-v3-mainnet-configured-diagnostic.spkg
            ${{ runner.temp }}/uniswap-v3-base-configured-diagnostic.spkg
            ${{ runner.temp }}/uniswap-v3-configured-diagnostic-evidence.json
            ${{ runner.temp }}/uniswap-v3-controlled-build-candidate.json
            ${{ runner.temp }}/uniswap-v3-parity-client
          if-no-files-found: error

  uniswap-v3-matic-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install checksum-pinned validation dependencies
        run: python3 -m pip install --require-hashes -r requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "18.18.0"
      - name: Reproduce exact deployed Matic source and behavior closure
        run: ./scripts/verify-uniswap-v3-matic-source.sh

  uniswap-v2-base-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install checksum-pinned validation dependencies
        run: python3 -m pip install --require-hashes -r requirements-ci.txt
      - name: Verify pinned behavioral source and generic extractor gap
        run: ./scripts/verify-uniswap-v2-base-source.sh

  pancakeswap-infinity-cl-bsc-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
