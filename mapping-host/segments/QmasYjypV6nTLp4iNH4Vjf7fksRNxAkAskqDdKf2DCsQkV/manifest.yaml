  - grafting
repository: 'https://github.com/Uniswap/uniswap-v3-subgraph'
schema:
  file:
    /: /ipfs/QmTiEqVtfjTDY8DRkj17eLKSAyajHNz8r7Yg9cRgXwrWfF
specVersion: 1.2.0
templates:
  - kind: ethereum/contract
    mapping:
      abis:
        - file:
            /: /ipfs/QmVszVJj4c73MuQGv5Bi9Kje5tpGijPCDXie7fXTqGAFi9
          name: Pool
        - file:
            /: /ipfs/QmamyiWBuT1kyYy6r97DamQ7eowheMw7nfGZUFdAmaFRG8
          name: Factory
        - file:
            /: /ipfs/QmXuTbDkNrN27VydxbS2huvKRk62PMgUTdPDWkxcr2w7j2
          name: ERC20
      apiVersion: 0.0.7
      entities:
        - Pool
        - Token
      eventHandlers:
        - event: 'Initialize(uint160,int24)'
          handler: handleInitialize
        - calls:
            feeGrowthGlobal0X128: 'Pool[event.address].feeGrowthGlobal0X128()'
            feeGrowthGlobal1X128: 'Pool[event.address].feeGrowthGlobal1X128()'
          event: >-
            Swap(indexed address,indexed
            address,int256,int256,uint160,uint128,int24)
          handler: handleSwap
        - calls:
            poolTickLower: 'Pool[event.address].ticks(event.params.tickLower)'
            poolTickUpper: 'Pool[event.address].ticks(event.params.tickUpper)'
          event: >-
            Mint(address,indexed address,indexed int24,indexed
            int24,uint128,uint256,uint256)
          handler: handleMint
        - calls:
            poolTickLower: 'Pool[event.address].ticks(event.params.tickLower)'
            poolTickUpper: 'Pool[event.address].ticks(event.params.tickUpper)'
          event: >-
            Burn(indexed address,indexed int24,indexed
            int24,uint128,uint256,uint256)
          handler: handleBurn
        - calls:
            feeGrowthGlobal0X128: 'Pool[event.address].feeGrowthGlobal0X128()'
            feeGrowthGlobal1X128: 'Pool[event.address].feeGrowthGlobal1X128()'
          event: >-
            Flash(indexed address,indexed
            address,uint256,uint256,uint256,uint256)
          handler: handleFlash
      file:
        /: /ipfs/QmQgC18iXqZc5Jp78KZs6wNpk2oZvgbe9TeMQnH9K7eMah
      kind: ethereum/events
      language: wasm/assemblyscript
    name: Pool
    network: base
