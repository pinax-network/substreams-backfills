[package]
name = "uniswap-v3-npm-source-block"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Provider-free Uniswap V3 NPM source-block Substreams module"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hex = "=0.4.3"
prost = "=0.13.3"
prost-types = "=0.13.3"
pest = "=2.7.14"
pest_derive = "=2.7.14"
pest_generator = "=2.7.14"
pest_meta = "=2.7.14"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
sha2 = "=0.10.8"
substreams = "=0.6.4"
substreams-ethereum = "=0.10.6"

[build-dependencies]
home = "=0.5.9"
indexmap = "=2.2.5"
tempfile = "=3.10.1"

[profile.release]
lto = true
opt-level = "z"
strip = "debuginfo"
