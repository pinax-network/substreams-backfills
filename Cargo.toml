[workspace]
resolver = "2"
members = ["common"]
exclude = ["uniswap-v3/source", "uniswap-v4"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pinax-network/substreams-backfills"

[workspace.dependencies]
substreams = "0.6"
substreams-ethereum = "0.10"
substreams-entity-change = "2"
prost = "0.13"
