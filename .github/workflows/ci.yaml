name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install checksum-pinned validation dependencies
        run: python3 -m pip install --require-hashes -r requirements-ci.txt
      - name: Install checksum-pinned WABT writer-evidence tool
        run: |
          curl -fsSL \
            https://github.com/WebAssembly/wabt/releases/download/1.0.35/wabt-1.0.35-ubuntu-20.04.tar.gz \
            -o "$RUNNER_TEMP/wabt-1.0.35-ubuntu-20.04.tar.gz"
          echo "cb3d22440273b1e8ee641e622b7a32222d97b519ad46169b1f8fcc6ce9af0b9b  $RUNNER_TEMP/wabt-1.0.35-ubuntu-20.04.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/wabt-1.0.35-ubuntu-20.04.tar.gz" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/wabt-1.0.35/bin/wasm2wat" --version)" = "1.0.35"
          echo "WASM2WAT=$RUNNER_TEMP/wabt-1.0.35/bin/wasm2wat" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/wabt-1.0.35/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check workspace formatting
        run: cargo fmt --all --check
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Run strict workspace lints
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Validate target and eligibility contracts
        run: python3 scripts/validate-targets.py
      - name: Verify immutable Uniswap V3 Matic target and static layout profile
        run: python3 scripts/verify-uniswap-v3-matic-target.py
      - name: Verify immutable Uniswap V2 Base target and static source-gap profile
        run: python3 scripts/verify-uniswap-v2-base-target.py
      - name: Verify immutable PancakeSwap Infinity CL BSC target
        run: python3 scripts/verify-pancakeswap-infinity-cl-bsc-target.py
      - name: Verify immutable Exchange V3 BSC target
        run: python3 scripts/verify-exchange-v3-bsc-target.py
      - name: Verify immutable Aerodrome Slipstream CL Base target
        run: |
          wasm-validate aerodrome-slipstream-base/reference/mappings/Factory.wasm
          wasm-validate aerodrome-slipstream-base/reference/mappings/NonfungiblePositionManager.wasm
          wasm-validate aerodrome-slipstream-base/reference/mappings/Pool.wasm
          python3 scripts/verify-aerodrome-slipstream-base-target.py
          python3 -m unittest scripts.tests.test_aerodrome_slipstream_base_target
      - name: Verify immutable Messari V3 BSC/Base target baselines
        run: |
          mapfile -t messari_wasm < <(find messari-v3/reference -type f -name '*.wasm' -print | sort)
          test "${#messari_wasm[@]}" -eq 8
          for wasm in "${messari_wasm[@]}"; do
            wasm-validate "$wasm"
          done
          python3 scripts/verify-messari-v3-targets.py
          python3 -m unittest scripts.tests.test_messari_v3_targets
      - name: Verify immutable Uniswap V3 graft ancestry
        run: python3 scripts/verify-uniswap-v3-graft-ancestry.py
      - name: Recompute Uniswap V3 writer compatibility evidence
        run: python3 scripts/verify-uniswap-v3-writer-semantics.py --wasm2wat "$WASM2WAT"
      - name: Recompute Uniswap V3 segment writer matrix
        run: python3 scripts/verify-uniswap-v3-segment-writer-matrix.py --wasm2wat "$WASM2WAT"
      - name: Verify Uniswap V3 Graph Node execution-order supplement
        run: |
          python3 scripts/verify-uniswap-v3-execution-order.py
          python3 -m unittest scripts.tests.test_uniswap_v3_execution_order
      - name: Verify scoped Uniswap V3 segment field semantics
        run: |
          python3 scripts/verify-uniswap-v3-segment-field-semantics.py
          python3 -m unittest scripts.tests.test_uniswap_v3_segment_field_semantics
      - name: Recompute full-inventory Uniswap V3 segment field-semantics v2
        run: |
          python3 scripts/verify-uniswap-v3-segment-field-semantics-v2.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_segment_field_semantics_v2
      - name: Verify bounded modern Uniswap V3 Factory guards
        run: |
          python3 scripts/verify-uniswap-v3-modern-factory-guard.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_modern_factory_guard
      - name: Recompute retained-WAT Uniswap V3 Pool Initialize semantics
        run: |
          python3 scripts/verify-uniswap-v3-pool-initialize.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_pool_initialize
      - name: Verify complete path-qualified Uniswap V3 Pool Initialize v2
        run: |
          python3 scripts/verify-uniswap-v3-pool-initialize-v2.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_pool_initialize_v2
      - name: Verify complete path-qualified Uniswap V3 NPM Transfer v2
        run: |
          python3 scripts/verify-uniswap-v3-npm-transfer-v2.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_npm_transfer_v2
      - name: Verify complete path-qualified Uniswap V3 NPM Collect v2
        run: |
          python3 scripts/verify-uniswap-v3-npm-collect-v2.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_npm_collect_v2
      - name: Verify paired complete path-qualified Uniswap V3 NPM Liquidity v2
        run: |
          python3 scripts/verify-uniswap-v3-npm-liquidity-v2.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_npm_liquidity_v2
      - name: Verify candidate complete Uniswap V3 all-handlers v1 matrix
        run: |
          python3 scripts/verify-uniswap-v3-all-handlers-v1.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_all_handlers_v1
      - name: Verify canonical Uniswap V3 all-handlers v1 publication seal
        run: |
          python3 scripts/verify-uniswap-v3-all-handlers-v1-publication.py
          python3 -m unittest scripts.tests.test_uniswap_v3_all_handlers_v1_publication
      - name: Verify bounded all-profile Uniswap V3 Pool runtime capsules
        run: |
          python3 scripts/verify-uniswap-v3-pool-runtime.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_pool_runtime
      - name: Recompute retained-WAT Uniswap V3 Pool Burn TVL semantics
        run: |
          python3 scripts/verify-uniswap-v3-pool-burn.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_pool_burn
      - name: Verify complete Uniswap V3 Pool Burn schema-API matrix v2
        run: |
          python3 scripts/verify-uniswap-v3-pool-burn-v2.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_pool_burn_v2
      - name: Recompute retained-WAT Uniswap V3 Pool Mint TVL semantics
        run: |
          python3 scripts/verify-uniswap-v3-pool-mint.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_pool_mint
      - name: Verify complete Uniswap V3 Pool Mint schema-API matrix v2
        run: |
          python3 scripts/verify-uniswap-v3-pool-mint-v2.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_pool_mint_v2
      - name: Recompute retained-WAT Uniswap V3 Pool Swap core-state semantics
        run: |
          python3 scripts/verify-uniswap-v3-pool-swap-core.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_pool_swap_core
      - name: Recompute retained-WAT Uniswap V3 Pool Flash semantics
        run: |
          python3 scripts/verify-uniswap-v3-pool-flash.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_pool_flash
      - name: Recompute complete path-qualified Uniswap V3 Pool Flash v2 matrix
        run: |
          python3 scripts/verify-uniswap-v3-pool-flash-v2.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_pool_flash_v2
      - name: Recompute retained-WAT Uniswap V3 Pool Swap fee-growth semantics
        run: |
          python3 scripts/verify-uniswap-v3-pool-swap-fee-growth.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_pool_swap_fee_growth
      - name: Verify complete Uniswap V3 Pool Swap schema-API matrix v2
        run: |
          python3 scripts/verify-uniswap-v3-pool-swap-v2.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_pool_swap_v2
      - name: Verify bounded Uniswap V3 Factory effect suffixes
        run: |
          python3 scripts/verify-uniswap-v3-factory-effects.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_factory_effects
      - name: Verify bounded modern Uniswap V3 Factory static semantics
        run: |
          python3 scripts/verify-uniswap-v3-modern-factory-static.py --wasm2wat "$WASM2WAT"
          python3 -m unittest \
            scripts.tests.test_uniswap_v3_wat_runtime \
            scripts.tests.test_uniswap_v3_modern_factory_static
      - name: Recompute bounded Uniswap V3 Factory fee-growth initialization
        run: |
          python3 scripts/verify-uniswap-v3-factory-fee-growth-init.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_factory_fee_growth_init
      - name: Recompute bounded Uniswap V3 Factory Pool bigint initialization
        run: |
          python3 scripts/verify-uniswap-v3-factory-pool-bigint-init.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_factory_pool_bigint_init
      - name: Recompute bounded Uniswap V3 Factory Pool price initialization
        run: |
          python3 scripts/verify-uniswap-v3-factory-pool-price-init.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_factory_pool_price_init
      - name: Verify complete all-profile Uniswap V3 Factory static semantics v2
        run: |
          python3 scripts/verify-uniswap-v3-factory-static-v2.py --wasm2wat "$WASM2WAT"
          python3 -m unittest scripts.tests.test_uniswap_v3_factory_static_v2
      - name: Test eligibility decisions and freshness gates
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  uniswap-v3-reference:
    runs-on: ubuntu-latest
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: scripts/parity-client/go.sum
      - name: Install checksum-pinned validation dependencies
        run: python3 -m pip install --require-hashes -r requirements-ci.txt
      - name: Fetch pinned V3 history mirror
        run: >-
          git fetch --no-tags origin
          refs/heads/upstream/uniswap-v3-qma8a81t-parity:refs/remotes/origin/upstream/uniswap-v3-qma8a81t-parity
      - name: Verify isolated history mirror and exact source import
        run: ./scripts/verify-uniswap-v3-import.sh
      - name: Test logical-contract expected refusals
        run: python3 -m unittest scripts/tests/test_uniswap_v3_logical_contract.py
      - name: Verify versioned mainnet/Base ChainConfig contract
        run: |
          python3 scripts/build-uniswap-v3-chain-manifests.py --check
          python3 scripts/verify-uniswap-v3-chain-config.py
          python3 -m unittest scripts/tests/test_uniswap_v3_chain_config.py
          python3 -m unittest scripts/tests/test_uniswap_v3_mainnet_chain_config_parity.py
          python3 -m unittest scripts/tests/test_uniswap_v3_mainnet_parity_capture.py
          python3 -m unittest scripts/tests/test_uniswap_v3_mainnet_parity_candidate.py
          python3 -m unittest scripts/tests/test_uniswap_v3_mainnet_parity_runner.py
      - name: Verify diagnostic writer-runtime contract and refusals
        run: |
          python3 scripts/verify-uniswap-v3-writer-runtime.py
          python3 -m unittest scripts.tests.test_uniswap_v3_writer_runtime
      - name: Verify host-only Position reducer contract and refusals
        run: |
          python3 scripts/verify-uniswap-v3-position-reducer.py
          python3 -m unittest scripts.tests.test_uniswap_v3_position_reducer
      - name: Verify host-only Pool Flash reducer contract and refusals
        run: |
          python3 scripts/verify-uniswap-v3-flash-reducer.py
          python3 -m unittest scripts.tests.test_uniswap_v3_flash_reducer
      - name: Verify host-only NPM Transaction reducer contract and refusals
        run: |
          python3 scripts/verify-uniswap-v3-transaction-reducer.py
          python3 -m unittest scripts.tests.test_uniswap_v3_transaction_reducer
      - name: Verify provider-free NPM source-block contract and refusals
        run: |
          python3 scripts/verify-uniswap-v3-npm-source-block.py
          python3 -m unittest scripts.tests.test_uniswap_v3_npm_source_block
      - name: Verify host-only joint NPM reducer contract and refusals
        run: |
          python3 scripts/verify-uniswap-v3-npm-handler-reducer.py
          python3 -m unittest scripts.tests.test_uniswap_v3_npm_handler_reducer
      - name: Verify host-only resolved NPM input contract and refusals
        run: |
          python3 scripts/verify-uniswap-v3-npm-resolved-inputs.py
          python3 -m unittest scripts.tests.test_uniswap_v3_npm_resolved_inputs
      - name: Verify scoped segment field-semantics supplement and refusals
        run: |
          python3 scripts/verify-uniswap-v3-segment-field-semantics.py
          python3 -m unittest scripts.tests.test_uniswap_v3_segment_field_semantics
      - name: Verify host-only NPM observation-plan contract and refusals
        run: |
          python3 scripts/verify-uniswap-v3-npm-observation-plan.py
          python3 -m unittest scripts.tests.test_uniswap_v3_npm_observation_plan
      - name: Verify hermetic NPM provider-executor contract and refusals
        run: |
          python3 scripts/verify-uniswap-v3-npm-provider-executor.py
          python3 -m unittest scripts.tests.test_uniswap_v3_npm_provider_executor
      - name: Test and build the source-pinned protocol-v3 parity client
        working-directory: scripts/parity-client
        run: |
          test "$(go env GOVERSION)" = "go1.26.5"
          GOTOOLCHAIN=local go mod verify
          GOTOOLCHAIN=local go test -mod=readonly ./...
          GOTOOLCHAIN=local go vet -mod=readonly ./...
          if GOTOOLCHAIN=local go list -mod=readonly -deps ./... | grep -F 'services-control-plane'; then
            echo "private services-control-plane replacement entered the runtime dependency graph" >&2
            exit 1
          fi
          CGO_ENABLED=0 GOTOOLCHAIN=local go build -mod=readonly -trimpath -buildvcs=false -ldflags=-buildid= -o "$RUNNER_TEMP/uniswap-v3-parity-client" .
          test "$("$RUNNER_TEMP/uniswap-v3-parity-client" --version)" = "uniswap-v3-mainnet-parity-client-v1 (protocol v3; upstream v1.20.3 cc555bd4e325b65ac3f95dfde4655076f88d4a0a)"
      - uses: dtolnay/rust-toolchain@1.79
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Install checksum-pinned Substreams CLI
        run: |
          curl -fsSL https://github.com/streamingfast/substreams/releases/download/v1.20.3/substreams_linux_x86_64.tar.gz -o /tmp/substreams.tar.gz
          echo "90c71d04a75490efdf0493254a8563c3555690e622b3c6ade5100c0c773f8675  /tmp/substreams.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/substreams.tar.gz -C /usr/local/bin substreams
          test "$(substreams --version)" = "substreams version 1.20.3 (Commit cc555bd, Commit Date 2026-07-31T14:30:54Z)"
      - name: Test imported source on the host target
        working-directory: uniswap-v3/source
        run: cargo test --locked --target x86_64-unknown-linux-gnu
      - name: Test deterministic TickDayData and TickHourData fixtures
        run: >-
          cargo test --locked
          --manifest-path uniswap-v3/contract-tests/Cargo.toml
          --target x86_64-unknown-linux-gnu
      - name: Build imported source for Substreams WASM
        working-directory: uniswap-v3/source
        run: cargo build --locked --target wasm32-unknown-unknown --release
      - name: Pack and inspect evidence-only package
        run: |
          substreams pack -o "$RUNNER_TEMP/uniswap-v3-diagnostic.spkg" uniswap-v3/source/substreams.yaml
          python3 scripts/verify-uniswap-v3-diagnostic-package.py "$RUNNER_TEMP/uniswap-v3-diagnostic.spkg"
      - name: Materialize configured runtime without changing the frozen import
        run: ./scripts/materialize-uniswap-v3-chain-config.sh "$RUNNER_TEMP/uniswap-v3-configured"
      - name: Test configured runtime on the host target
        working-directory: ${{ runner.temp }}/uniswap-v3-configured
        run: cargo test --locked --target x86_64-unknown-linux-gnu
      - name: Build the one shared configured WASM
        working-directory: ${{ runner.temp }}/uniswap-v3-configured
        run: cargo build --locked --target wasm32-unknown-unknown --release
      - name: Pack both configured diagnostic manifests and prove embedded WASM identity
        working-directory: ${{ runner.temp }}/uniswap-v3-configured
        run: |
          substreams pack -o "$RUNNER_TEMP/uniswap-v3-mainnet-configured-diagnostic.spkg" substreams.mainnet.yaml
          substreams pack -o "$RUNNER_TEMP/uniswap-v3-base-configured-diagnostic.spkg" substreams.base.yaml
          python3 "$GITHUB_WORKSPACE/scripts/verify-uniswap-v3-chain-config.py" \
            --root "$GITHUB_WORKSPACE" \
            --runtime "$RUNNER_TEMP/uniswap-v3-configured" \
            --mainnet-spkg "$RUNNER_TEMP/uniswap-v3-mainnet-configured-diagnostic.spkg" \
            --base-spkg "$RUNNER_TEMP/uniswap-v3-base-configured-diagnostic.spkg" \
            --evidence-out "$RUNNER_TEMP/uniswap-v3-configured-diagnostic-evidence.json"
      - name: Materialize the isolated diagnostic writer runtime
        run: ./scripts/materialize-uniswap-v3-writer-runtime.sh "$RUNNER_TEMP/uniswap-v3-writer-runtime"
      - name: Test the writer runtime and format-check its standalone Rust files
        working-directory: ${{ runner.temp }}/uniswap-v3-writer-runtime
        run: |
          test "$(rustc +1.79.0 --version)" = "rustc 1.79.0 (129f3b996 2024-06-10)"
          cargo +1.79.0 test --locked --target x86_64-unknown-linux-gnu
          rustfmt +1.79.0 --edition 2021 --check \
            build.rs src/writer_runtime.rs src/pb/uniswap.writer.v1.rs
      - name: Enforce exact inherited Clippy inventory and strict new-file cleanliness
        run: >-
          python3 scripts/verify-uniswap-v3-writer-clippy.py
          --baseline "$RUNNER_TEMP/uniswap-v3-configured"
          --runtime "$RUNNER_TEMP/uniswap-v3-writer-runtime"
          --target x86_64-unknown-linux-gnu
      - name: Build the one shared writer-runtime WASM
        working-directory: ${{ runner.temp }}/uniswap-v3-writer-runtime
        run: cargo +1.79.0 build --locked --target wasm32-unknown-unknown --release
      - name: Pack both writer diagnostics and prove the exact shared WASM contract
        working-directory: ${{ runner.temp }}/uniswap-v3-writer-runtime
        run: |
          substreams pack -o "$RUNNER_TEMP/uniswap-v3-mainnet-writer-diagnostic.spkg" substreams.mainnet.yaml
          substreams pack -o "$RUNNER_TEMP/uniswap-v3-base-writer-diagnostic.spkg" substreams.base.yaml
          substreams pack -o "$RUNNER_TEMP/uniswap-v3-mainnet-writer-diagnostic-repeat.spkg" substreams.mainnet.yaml
          substreams pack -o "$RUNNER_TEMP/uniswap-v3-base-writer-diagnostic-repeat.spkg" substreams.base.yaml
          cmp "$RUNNER_TEMP/uniswap-v3-mainnet-writer-diagnostic.spkg" \
            "$RUNNER_TEMP/uniswap-v3-mainnet-writer-diagnostic-repeat.spkg"
          cmp "$RUNNER_TEMP/uniswap-v3-base-writer-diagnostic.spkg" \
            "$RUNNER_TEMP/uniswap-v3-base-writer-diagnostic-repeat.spkg"
          python3 "$GITHUB_WORKSPACE/scripts/verify-uniswap-v3-writer-runtime.py" \
            --root "$GITHUB_WORKSPACE" \
            --runtime "$RUNNER_TEMP/uniswap-v3-writer-runtime" \
            --mainnet-spkg "$RUNNER_TEMP/uniswap-v3-mainnet-writer-diagnostic.spkg" \
            --base-spkg "$RUNNER_TEMP/uniswap-v3-base-writer-diagnostic.spkg"
      - name: Materialize the provider-free NPM source-block package
        run: ./scripts/materialize-uniswap-v3-npm-source-block.sh "$RUNNER_TEMP/uniswap-v3-npm-source-block"
      - name: Test, lint, and format-check the standalone NPM source runtime
        working-directory: ${{ runner.temp }}/uniswap-v3-npm-source-block/npm-source-block-runtime
        run: |
          cargo +1.79.0 metadata --locked --no-deps --format-version 1 >/dev/null
          cargo +1.79.0 test --locked --target x86_64-unknown-linux-gnu
          cargo +1.79.0 clippy --locked --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
          rustfmt +1.79.0 --edition 2021 --config-path rustfmt.toml --check \
            src/lib.rs src/npm_source_block.rs src/pb/mod.rs \
            src/pb/uniswap.npm.source.v1.rs src/pb/uniswap.writer.v1.rs
      - name: Build both NPM source WASMs and preserve the writer binary
        working-directory: ${{ runner.temp }}/uniswap-v3-npm-source-block
        run: |
          cargo +1.79.0 build --locked --target wasm32-unknown-unknown --release
          cargo +1.79.0 build --locked --target wasm32-unknown-unknown --release \
            --manifest-path npm-source-block-runtime/Cargo.toml
          cmp \
            "$RUNNER_TEMP/uniswap-v3-writer-runtime/target/wasm32-unknown-unknown/release/substreams_uniswap_v3.wasm" \
            target/wasm32-unknown-unknown/release/substreams_uniswap_v3.wasm
      - name: Pack provider-free NPM source packages twice and preserve writer packages
        working-directory: ${{ runner.temp }}/uniswap-v3-npm-source-block
        run: |
          substreams pack -o "$RUNNER_TEMP/uniswap-v3-mainnet-npm-source.spkg" npm-source-package/substreams.npm-source.mainnet.yaml
          substreams pack -o "$RUNNER_TEMP/uniswap-v3-base-npm-source.spkg" npm-source-package/substreams.npm-source.base.yaml
