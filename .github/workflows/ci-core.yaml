name: ci-core
# Always runs. Required status check for main: formatting, workspace tests and
# lints, and the target/eligibility contract validation shared by every family.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
        with:
          cache-on-failure: true
      - name: Check workspace formatting
        run: cargo fmt --all --check
      - name: Restore checksum-keyed evidence asset cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/substreams-backfills/evidence-assets
          key: evidence-assets-${{ hashFiles('evidence-assets.lock.json') }}
      - name: Fetch and verify externalized evidence assets
        # The Matic target tests copy two externalized retained contracts
        # (graft-ancestry/v2, segment-writer-matrix/v1) into their fixture tree.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask evidence fetch
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Verify canonical BlockChanges v1 schema and golden wire
        run: cargo test -p backfill-common --locked
      - name: Run strict workspace lints
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Validate target and eligibility contracts
        run: cargo xtask verify-targets
