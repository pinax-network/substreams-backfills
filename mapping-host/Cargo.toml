[workspace]
members = ["."]
resolver = "2"

[package]
name = "graph-mapping-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pinax-network/substreams-backfills"
description = "Hermetic host that runs deployed subgraph mapping WASM under Graph Node's own runtime crates"
publish = false

[lib]
name = "graph_mapping_host"
path = "src/lib.rs"

[[bin]]
name = "graph-mapping-host"
path = "src/main.rs"

[patch."https://github.com/graphprotocol/graph-node"]
# The per-save operation stream is not observable through graph-node's public
# API: `EntityCache` collapses writes into a `HashMap`. `vendor/graph-runtime-wasm`
# is the crate copied verbatim from the pinned revision plus the minimal patch in
# `vendor/graph-runtime-wasm.patch`, which adds an optional recorder beside the
# existing proof-of-indexing writes.
graph-runtime-wasm = { path = "vendor/graph-runtime-wasm" }

[dependencies]
backfill-common = { path = "../common" }
prost = "0.13"
graph = { git = "https://github.com/graphprotocol/graph-node", rev = "77823b5a7adc4eac4abf03202c8dd7cb00dea31d" }
graph-runtime-wasm = { git = "https://github.com/graphprotocol/graph-node", rev = "77823b5a7adc4eac4abf03202c8dd7cb00dea31d" }
graph-chain-ethereum = { git = "https://github.com/graphprotocol/graph-node", rev = "77823b5a7adc4eac4abf03202c8dd7cb00dea31d" }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
sha2 = "0.10"

# Debug info is the bulk of a test binary here, and there is a lot of test
# binary: this crate links `graph`, `graph-chain-ethereum`,
# `graph-runtime-wasm` and wasmtime, 577 crates, into every target. With debug
# info on, `cargo test` asked the linker for roughly 700 MB of executables and a
# GitHub-hosted runner died with a bus error partway through.
#
# `dev` covers the dependencies a test build compiles, `test` covers this
# crate's own test targets, and `strip` drops whatever debug info arrives from
# either anyway. The cost is that a panic backtrace names functions but not
# source lines, which no assertion depends on; the tests fail with their own
# messages, not with a backtrace.
[profile.dev]
debug = 0
strip = "debuginfo"

[profile.test]
debug = 0
strip = "debuginfo"
